[project]
name = "rfp-intelligence-platform"
version = "0.1.0"
description = "RFP Intelligence Platform: hybrid RAG search and a multi-agent extractor for bid documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "docling>=2.20",
    "sentence-transformers>=3.3",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "watchdog>=6.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "pdfplumber>=0.11.10",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
