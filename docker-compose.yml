services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: laxana
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      target: api
    command: ["sh", "-c", "python -m rfp_intel.db.migrate && exec python main.py serve --host 0.0.0.0 --port 8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:laxana@postgres:5432/postgres
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/output
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - hf_cache:/cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: sync+restart
          path: ./api
          target: /app/api
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: sync+restart
          path: ./main.py
          target: /app/main.py
        - action: sync+restart
          path: ./migrations
          target: /app/migrations
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./Dockerfile

  streamlit:
    build:
      context: .
      target: ui
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    develop:
      watch:
        - action: sync+restart
          path: ./ui
          target: /app/ui
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./Dockerfile

volumes:
  pgdata:
  qdrant_data:
  hf_cache:
